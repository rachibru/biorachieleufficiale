# Welcome to Jekyll!

# Basic Site Settings
locale                  : "it-IT"
title                   : "Bruno Rachiele"
title_separator         : "-"
name                    : &name "Bruno Rachiele"
description             : &description "Sito personale di Bruno Rachiele, studente di Giurisprudenza"
url                     : "https://rachibru.github.io"
baseurl                 : "/biorachieleufficiale" # Rimuovi "/lavorieprove" e lascia "" se il repository principale si chiama rachibru.github.io
repository              : "rachibru/lavorieprove"

# Site Author
author:
  # Biographic information
  avatar                : "profile.png" # File posizionato in /images/profile.png
  name                  : "Bruno Rachiele"
  pronouns              : 
  bio                   : "Studente di Giurisprudenza"
  location              : "Italia"
  employer              : "Università degli Studi di..."
  uri                   : 
  email                 : "bruno_rachiele@libero.it"

  # Academic websites
  arxiv                 : 
  googlescholar         : "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  impactstory           : 
  orcid                 : 
  pubmed                : 
  researchgate          : 

  # Repositories and software development
  bitbucket             : 
  codepen               : 
  dribbble              : 
  github                : "rachibru"
  kaggle                : 
  stackoverflow         : 

  # Social media
  bluesky               : 
  facebook              : 
  instagram             : 
  linkedin              : # es. "bruno-rachiele"
  mastodon              : 
  medium                : 
  twitter               : 
  youtube               : 

# Site Settings
teaser                  : 
breadcrumbs             : false
words_per_minute        : 160
future                  : true
read_more               : "disabled"
talkmap_link            : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Rome

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
